[package]
name = "feedreader"
version.workspace = true
edition.workspace = true

[dependencies]
toolkit = { path = "../toolkit" }
engine = { path = "../engine" }
winit = "0.30.13"
wry = "0.57.0"
chrono = "0.4.45"
png = "0.18.1"
arboard = "3.6.1"
profiling = "1"
tracy-client = { version = "0.18", optional = true }
serde_json = "1"
url = "2"
toml = "0.9"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1", features = ["derive"] }

[features]
profile = ["dep:tracy-client", "profiling/profile-with-tracy", "toolkit/profile", "engine/profile"]
