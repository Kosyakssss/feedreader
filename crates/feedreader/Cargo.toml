[package]
name = "feedreader"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[package.metadata.graticule]
name = "Feedreader"
id = "app.feedreader"
command = "feedreader"
category = "public.app-category.news"

[dependencies]
graticule = { path = "../graticule" }
engine = { path = "../engine" }
winit = "0.30.13"
wry = "0.57.0"
chrono = "0.4.45"
profiling = "1"
tracy-client = { version = "0.18", optional = true }
serde_json = "1"
url = "2"
toml = "0.9"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1", features = ["derive"] }
qrcode = { version = "0.14", default-features = false }

[features]
profile = ["dep:tracy-client", "profiling/profile-with-tracy", "graticule/profile", "engine/profile"]

[dev-dependencies]
proptest = "1.12.0"
