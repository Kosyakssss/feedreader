[package]
name = "engine"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = "0.4.45"
dirs = "7.0.0"
dom_smoothie = "0.18.2"
feed-rs = "3.0.0"
futures = "0.3.34"
getrandom = "0.3"
html-escape = "0.2.15"
profiling = "1"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process"] }
url = "2.5.8"

[features]
profile = ["profiling/profile-with-tracy"]

[dev-dependencies]
proptest = "1.12.0"
