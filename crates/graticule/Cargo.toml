[package]
name = "graticule"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
arboard = "3.6.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
parley = "0.11.1"
png = "0.18.1"
pollster = "1.0.1"
profiling = "1"
rfd = "0.17.2"
swash = "0.2.10"
wgpu = "30.0.1"
winit = "0.30.13"
wry = "0.57.0"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }

[features]
profile = ["profiling/profile-with-tracy"]

[dev-dependencies]
proptest = "1.12.0"
