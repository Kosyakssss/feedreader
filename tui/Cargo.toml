[package]
name = "feedreader-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  "rustls-tls",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
